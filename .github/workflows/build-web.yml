name: Captain Crazy Pinball - WebAssembly

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'

      - name: Download MIT game engine and CC0 game data
        shell: bash
        run: |
          git clone --depth 1 https://github.com/k4zmu2a/SpaceCadetPinball.git engine
          git clone --depth 1 https://github.com/andrewnakas/open-cadet.git open-cadet
          test -s open-cadet/PINBALL.DAT
          test -f engine/CMakeLists.txt
          mkdir -p data
          cp open-cadet/PINBALL.DAT data/
          find open-cadet -type f -name 'sound*.wav' -exec cp '{}' data/ \;
          echo "CC0 sound files: $(find data -name 'sound*.wav' | wc -l)"
          test "$(find data -name 'sound*.wav' | wc -l)" -ge 40

      - name: Make browser main loop cooperative
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('engine/SpaceCadetPinball/winmain.cpp')
          s = p.read_text()
          s = '#ifdef __EMSCRIPTEN__\n#include <emscripten/emscripten.h>\n#endif\n' + s
          start = s.find('void winmain::MainLoop()')
          if start < 0:
              raise SystemExit('MainLoop not found')
          needle = '\twhile (true)\n\t{'
          pos = s.find(needle, start)
          if pos < 0:
              raise SystemExit('MainLoop loop not found')
          replacement = needle + '\n#ifdef __EMSCRIPTEN__\n        emscripten_sleep(1);\n#endif'
          s = s[:pos] + s[pos:].replace(needle, replacement, 1)
          p.write_text(s)
          print('Browser main loop yields to the event loop')
          PYCODE

      - name: Prepare CMake for Emscripten
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/CMakeLists.txt')
          s = p.read_text()
          old = 'find_package(SDL2 REQUIRED)\nFIND_PACKAGE(SDL2_mixer REQUIRED)'
          if old not in s:
              raise SystemExit('CMake SDL dependency signature changed upstream')
          s = s.replace(old, '''if(EMSCRIPTEN)
            set(SDL2_INCLUDE_DIR "${CMAKE_SYSROOT}/include/SDL2")
            set(SDL2_MIXER_INCLUDE_DIR "${CMAKE_SYSROOT}/include/SDL2")
            set(SDL2_LIBRARY "")
            set(SDL2_MIXER_LIBRARY "")
          else()
            find_package(SDL2 REQUIRED)
            FIND_PACKAGE(SDL2_mixer REQUIRED)
          endif()''')
          old2 = 'target_link_libraries(SpaceCadetPinball ${SDL2_LIBRARY} ${SDL2_MIXER_LIBRARY})'
          if old2 not in s:
              raise SystemExit('CMake link signature changed upstream')
          s = s.replace(old2, old2 + '''
          if(EMSCRIPTEN)
            set_target_properties(SpaceCadetPinball PROPERTIES SUFFIX ".html")
            target_compile_options(SpaceCadetPinball PRIVATE "-sUSE_SDL=2" "-sUSE_SDL_MIXER=2")
            target_link_options(SpaceCadetPinball PRIVATE
              "-sUSE_SDL=2" "-sUSE_SDL_MIXER=2"
              "-sALLOW_MEMORY_GROWTH=1"
              "-sFORCE_FILESYSTEM=1"
              "-sEXIT_RUNTIME=0"
              "-sASYNCIFY=1"
              "-sASYNCIFY_STACK_SIZE=65536"
              "SHELL:--preload-file ${CMAKE_SOURCE_DIR}/../data@/"
            )
          endif()
          ''')
          p.write_text(s)
          print('Emscripten CMake adaptation prepared')
          PY

      - name: Configure
        shell: bash
        run: |
          emcmake cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS='-Wno-error'

      - name: Compile
        shell: bash
        run: cmake --build build --parallel 2

      - name: Bundle browser files
        shell: bash
        run: |
          mkdir -p site
          find engine/bin -maxdepth 1 -type f \( -name '*.html' -o -name '*.wasm' -o -name '*.js' -o -name '*.data' \) -exec cp '{}' site/ \;
          ls -lah site
          test -n "$(find site -name '*.wasm' -print -quit)"
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          site = Path('site')
          htmls = sorted(site.glob('*.html'))
          if not htmls:
              raise SystemExit('No HTML entry point produced')
          if not (site / 'index.html').exists():
              shutil.copyfile(htmls[0], site / 'index.html')
          print('Entry point:', (site / 'index.html').stat().st_size, 'bytes')
          PY
          touch site/.nojekyll
          # Add mobile touch controls to the generated Emscripten page.
          python3 - <<'PYMOBILE'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text()
          overlay = r"""
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
          <style>
          #cc-mobile-controls{position:fixed;bottom:0;left:0;right:0;z-index:99999;display:flex;gap:7px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#130922ee;justify-content:center;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
          #cc-mobile-controls button{flex:1;min-height:62px;border:2px solid #b15aff;border-radius:12px;background:#392067;color:#fff;font:bold 15px system-ui;touch-action:none;-webkit-tap-highlight-color:transparent}
          #cc-mobile-controls button[data-key=Space]{background:#a94d17;border-color:#ffae4e}
          #cc-mobile-controls button:active{background:#7b29bd}
          #canvas{max-width:100vw!important}
          body{padding-bottom:86px!important}
          </style>
          <div id="cc-mobile-controls" aria-label="Mobile pinball controls">
            <button data-key="F2">START</button>
            <button data-key="KeyZ">◀ LEFT</button>
            <button data-key="Space">LAUNCH</button>
            <button data-key="Slash">RIGHT ▶</button>
          </div>
          <script>
          (function(){
            var keys={F2:{key:'F2',code:'F2',keyCode:113},KeyZ:{key:'z',code:'KeyZ',keyCode:90},Space:{key:' ',code:'Space',keyCode:32},Slash:{key:'/',code:'Slash',keyCode:191}};
            var held=new Map();
            function send(code,down){var k=keys[code];if(!k)return;var e=new KeyboardEvent(down?'keydown':'keyup',{key:k.key,code:k.code,keyCode:k.keyCode,which:k.keyCode,bubbles:true,cancelable:true});
              document.dispatchEvent(e);}
            document.querySelectorAll('#cc-mobile-controls button').forEach(function(btn){
              var code=btn.dataset.key;
              btn.addEventListener('pointerdown',function(e){e.preventDefault();btn.setPointerCapture(e.pointerId);if(!held.has(e.pointerId)){held.set(e.pointerId,code);send(code,true);}});
              function release(e){e.preventDefault();if(held.has(e.pointerId)){send(held.get(e.pointerId),false);held.delete(e.pointerId);}}
              btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',function(e){if(held.has(e.pointerId)){send(held.get(e.pointerId),false);held.delete(e.pointerId);}});
            });
            window.addEventListener('blur',function(){held.forEach(function(code){send(code,false)});held.clear()});
          })();
          </script>
          """
          if '</body>' not in html:
              raise SystemExit('Generated Emscripten HTML has no body end tag')
          p.write_text(html.replace('</body>', overlay + '\n</body>', 1))
          print('Mobile touch controls injected')
          PYMOBILE

      - name: Upload downloadable WebAssembly build
        uses: actions/upload-artifact@v4
        with:
          name: captain-crazy-browser-test
          path: site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: compile
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
